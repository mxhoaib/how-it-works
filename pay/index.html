<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>Support How Things Work · Redirecting to PayPal…</title>
<style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#000;color:#f5f5f7;font-family:-apple-system,Segoe UI,Roboto,Arial,sans-serif;text-align:center}a{display:inline-block;margin-top:16px;padding:12px 22px;border-radius:14px;background:#ffc439;color:#111;font-weight:800;text-decoration:none}p{color:#a1a1aa}</style></head><body><main><h1 id="h">Taking you to PayPal…</h1><p id="d"></p><a id="go" href="../">Pay with PayPal</a><p><a href="../" style="background:none;color:#a1a1aa;font-weight:500">← Back</a></p></main>
<script>
// Items: amount in USD (null = buyer enters amount). No logins or secrets here.
var ITEMS={support:{n:'Support How Things Work',a:null},coffee:{n:'Buy the maker a coffee',a:5}};
var u=['https:','','paypal.me','imshoi'];
var k=new URLSearchParams(location.search).get('item'),it=Object.prototype.hasOwnProperty.call(ITEMS,k)?ITEMS[k]:null;
if(!it){document.getElementById('h').textContent='Unknown item';document.getElementById('d').textContent='Please go back and choose an option.';document.getElementById('go').style.display='none'}
else{if(it.a)u.push(it.a+'USD');var url=u.join('/');document.getElementById('h').textContent=it.n;document.getElementById('d').textContent=(it.a?'US$'+it.a+' · ':'')+'Secure payment on PayPal. Redirecting…';document.getElementById('go').href=url;setTimeout(function(){location.replace(url)},900)}
</script></body></html>
